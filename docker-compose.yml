version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: smart-exit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smart_exit_reminder

  # Phase 7+: uncomment to add backend container
  # backend:
  #   build: ./backend
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - mongodb
  #   env_file:
  #     - ./backend/.env

volumes:
  mongodb_data:
